[project]
name = "short-video-script-agent"
version = "0.1.0"
description = "短视频脚本 Agent：事实溯源与时长校验"
requires-python = ">=3.12"
dependencies = ["claude-agent-sdk==0.2.175", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
